          - { id: B2B-10-F2, role: backend, title: "Collaboration tenant-izoláció: RLS-baseline + interceptor-bekötés + query filter + concurrency-token", status: done, completed: 2026-07-29, depends_on: [B2B-10-F1], note: "2026-07-29 **ROOT-REVIEW: APPROVED** (root-mérés 126 unit + 25 integrációs zöld, 0 warning). Négy szelet. F2/1: mind a 8 RLS-policy a baseline NULLIF(...)::uuid alakra állítva — a csupasz current_setting(...)::uuid a shared interceptor pool-reset üres értéke mellett 22P02 cast-hibát dobott volna MINDEN lekérdezésen; + explicit WITH CHECK; + a participant-grant policy elvesztette a Status=0 szűrőt, mert WITH CHECK hiányában a USING az ÚJ sorra is érvényes, így a Revoke() UPDATE-jét 42501-gyel tiltotta — a grant-visszavonás lehetetlen volt éles DB-n. F2/2: a shared SpaceOsTenantSessionInterceptor DI-bekötése (addig a migrációk FORCE RLS policykat telepítettek egy session-kulcsra, amit SENKI nem állított be). F2/3: tenant query filter 6 entitáson, kétoldalú (host VAGY guest) — a két gyerektábla szándékosan RLS alatt marad. F2/4: agreement concurrency-token (Proposed-ból a host Cancel-je és a guest Accept-je is legális; token nélkül a vesztes fél sikert kap). BIZONYÍTÉK: új SpaceOS.Collaboration.IntegrationTests projekt, Testcontainers PostgreSQL + NOSUPERUSER/NOBYPASSRLS szerep — a modul első olyan tesztje, amit nem a saját LINQ-je dönt el. Ebből 4 teszt a PRE-F2 policy-alakot építi újra scratch táblán és a bukását állítja (22P02 / 42501), mert a zöld suite csak a mai állapotról szól, nem arról, hogy a régit elkapta volna. PLATFORM-LELET: az ADR-062 interceptort EGYETLEN modul sem mérte — mind (EHS is) kézzel állította a session-kulcsot a fixture SetTenantAsync-jével, amit a fixture maga is mirroring-nak nevez; egy tükör zöld marad, ha az eredeti elromlik. Az InterceptorEndToEndTests (5 teszt) a platform első ilyen mérése, minta a másik hat modulhoz — külön platform-task. ROOT-DÖNTÉS az F2 nyomán: az RLS a RÉSZVÉTELT szűrje, a grant az ENGEDÉLYT szabályozza (grant-alapú authorization az F3 application/API rétegében) — a kiírás eredeti grant-alapú RLS-policy megfogalmazása ezzel felülírva." }
          - { id: B2B-10-F3, role: backend, title: "Collaboration API-host + grant-alapú authorization (5 szelet: authorization · API-host · ETag/If-Match + Idempotency-Key · allowedActions-paritás + agreement-projekció · végpont-bizonyíték valódi PostgreSQL-en)", status: done, completed: 2026-07-30, depends_on: [B2B-10-F2], task: docs/tasks/EPIC-B2B-COLLABORATION-2026Q3/archive/B2B-10-F3-COLLABORATION-API-AUTHORIZATION.md, note: "2026-07-30 ROOT-REVIEW: mind az öt szelet APPROVED, végig saját root-méréssel. Záró mérés: 226/226 unit + 46/46 integrációs VALÓDI PostgreSQL-en, 0 warning. Root-döntések: (1) a megállapodás MAGA részvétel-alapú, amit HORDOZ (munkacsomagok) az grant-köteles — különben körkörös, mert a granteket maga a megállapodás adja ki; (2) a WorkPackageStatus.Disputed MARAD (az F0 nem a terméktől, hanem az MVP-től vette el a dispute-ot), és az elérhetetlenséget bizonyító őr-teszt root-döntés nélkül nem törölhető. ROOT-LELET, ami nem zárult: a jogosultság-előbb invariáns a MEGÁLLAPODÁS-úton mérés nélkül áll — az R-MC3/agreement mutáció mind a unit, mind az integrációs suite-ot TÚLÉLTE, mert egyetlen E2E teszt sem küld ÍRÁST nem-részesként. A root háromszor vitte át szeletről szeletre, ezért saját taskot kapott: B2B-10-F3X. Elfogadott korlát: a befejezett idempotencia-rekordokat semmi nem takarítja (üzemeltetési feladat, a pilot előtt ütemezés kell)." }
          - { id: B2B-10-F3X, role: backend, title: "A jogosultság-előbb sorrend bizonyítása a megállapodás-úton", status: done, depends_on: [B2B-10-F3], task: docs/tasks/EPIC-B2B-COLLABORATION-2026Q3/archive/B2B-10-F3X-ORDERING-PROOF.md, note: "2026-07-30 kiadva (root). XS. Egyetlen tétel, ami az F3 mind az öt szeletéből kimaradt, és amit a root háromszor vitt át (F3/2 -> F3/4 -> F3/5) — egy háromszor átvitt tétel nem szelet-maradék, hanem saját task; ezt a vezetőnek kell kimondania. Kell: E2E teszt valódi PostgreSQL-en, ahol a NEM-RÉSZES hívó hibás If-Match-csel is 404-et kap, ne 412-t (különben verzió-orákulum: egy idegen bérlő megtudná, milyen sűrűn változik más megállapodása). Plusz: MELYIK RÉTEG tartja a vonalat — az F3/5 ME-módszerével megmérve és kiírva (RLS · EF query filter · a sorrend maga); és negatív kontroll: az R-MC3/agreement mutáció ettől a teszttől BUKJON. A root NEM állítja, hogy ez ma aktív, kihasználható rés — hogy az RLS/EF-szűrő eleve elvágja-e a közvetlen repository-betöltést, nincs mérve; ha elvágja, a task a SORRENDET szögezi le, és az is érték, mert akkor a védelem egy MÁSIK rétegen áll." }
          - { id: B2B-10-F5, role: backend, title: "A projekt-horgony feloldása a Kernel felé (F5/0 mérés · F5/1 create-út · F5/2 HttpProjectAdapter · F5/3 negatív kontroll)", status: in_progress, depends_on: [B2B-10-F3], task: docs/tasks/EPIC-B2B-COLLABORATION-2026Q3/B2B-10-F5-PROJECT-ANCHOR-RESOLUTION.md, note: "2026-07-31 ROOT-DÖNTÉSEK az F5/0 mérése nyomán (KERNEL_TOKEN_PATH_MEASUREMENT_2026-07-30.md): (1) hitelesítési út = ON-BEHALF-OF (a hívó tokenjének továbbadása; mérve: egy token két audience-szel mindkét API-t kiszolgálja, a client_credentials tokenben nincs tid, tehát a service-identitás a bérlő-szűkítést csendben veszítené el). KIMONDOTT KORLÁT: az út kizárólag kérés-hatókörű — háttérfeldolgozásból (outbox-worker, ütemezett job) Kernel-hívás ezen az úton elvileg sem lehetséges; ha valaha kell, az ÚJ root-döntés, nem néma service-identity fallback. (2) ProjectOwnerTenantId TÖRÖLVE — a bérlő-bizonyíték a kernel 404-je, a mező a drótról nem tölthető, és a kernel-DTO-bővítő ág (Gábor-kapu) így elkerülve. (3) Hatókör: az F5 első fele (ProjectRef+migráció) az F1-ben leszállt; a maradék a create-út + a feloldó adapter. A visszavetítés NEM az F5-é (ADR-068 §11 → B2B-06). **F5/0 KÉSZ, ROOT-REVIEW APPROVED 2026-07-31** saját méréssel: hosting-suite 89/89 valódi Testcontainers-PostgreSQL-en; mutáció (a `{` ág kivéve, tiszta build-cache, sha1-alkalmazva-bizonyítás) pontosan 2 bukás; visszaállítás bájtra azonos. Az F5/0 menet közben talált és javított platform-hibája: a spaceos_tenants claim HARMADIK alakja (a .NET a tömb-claimet elemenként bontja → objektum-értékű claim) a TenantResolver-ben elhasalt, és a modul-kapu csendben 403-at adott — mind a 7 RequireEnabledModule-t használó modult érintette (e0b922d, origin/main-en). NEM MÉRT (kimondva): hogy az ÉLES realm ilyen claim-alakot ad-e ki — az éles Keycloak Gábor-kapu. **F5/1 KÉSZ, ROOT-REVIEW APPROVED 2026-07-31** (a4e1f49) saját méréssel: 256/256 unit + 52/52 integrációs (valódi PostgreSQL), 0 warning; root-mutáció (EnsureActorIsHost kivéve, tiszta cache, sha1-bizonyítás) pontosan 4 bukás. A create grant-köteles (WorkPackageExecute), Idempotency-Key KÖTELEZŐ (400 problem, RFC 6585-indoklással nem 428), a horgony és az AddAsync valós hívót kapott. Elfogadott korlát: a létrehozó user nem perzisztálódik (szimmetrikus); idempotencia-takarítás továbbra is üzemeltetési tétel. **F5/2 KÉSZ, ROOT-REVIEW APPROVED 2026-07-31** (d2b9689) saját méréssel: 277/277 unit + 53/53 integrációs, 0 warning; root-mutáció (401/403→null összecsukás, tiszta cache, sha1) pontosan 2 bukás. A kérés-hatókörű on-behalf-of dekrétum KÓDBAN él (OnBehalfOfTokenUnavailableException, nincs kliens-mapping); hibatérkép mint szerződés (404→null · 401/403→502 trust-fault · timeout/5xx→503, semmi nem olvad null-ba); a valós hívási pont a create-út scope-validálása (feloldatlan horgony 422, 0 sor íródik). ⚠ DEPLOY-BLOKKOLÓ (Gábor-listán): az éles hostnak kell a Collaboration:Kernel:BaseUrl, különben el sem indul (szándékos fail-fast). Ismert korlát: a ProjectId hívó-állította (a FlowEpicDto nem hordoz projekt-azonosítót) — F4/F5-3 anyag. **F5/3 KIADVA 2026-07-31** (backend inbox 003): negatív kontroll VALÓDI Kernellel — idegen bérlő tokenjével 422 + 0 sor, pozitív kontrollal, és kimondva melyik réteg tartja." }
