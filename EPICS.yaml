          - { id: B2B-10-F1, role: backend, title: "Collaboration application-réteg (repository + MediatR handlerek + Agreement-FSM + DI + work-scope horgony)", status: done, completed: 2026-07-29, depends_on: [B2B-10], task: docs/tasks/EPIC-B2B-COLLABORATION-2026Q3/archive/B2B-10-F1-COLLABORATION-APPLICATION-LAYER.md, note: "2026-07-29 kiadva a backendnek (inbox 011, a 010-es elő-kiírást váltja). Indulás a scheduling M4 mérföldkő-review APPROVED-ja UTÁN — addig a backend sávja az M4. Méret L → három szeletben kérve, mindegyik külön review_requested-tel. ROOT DÖNTÉS a kiírásban: a KernelWorkScope kizárólag a scheduling repóban létezik (a platform-fában és a közös SpaceOS.Modules.Contracts-ban sincs meg) → a Collaboration SAJÁT, szerkezetileg azonos CollaborationWorkScope-ot definiál, nem hivatkozik a scheduling csomagra; a szerződés a szerkezeti azonosság, conformance-teszttel a kézbesített scheduling-spec (SHA-256 3fc6c57d…) scope-sémájához pinelve. Előre jelzett csapdák: a mai RowVersion kézzel 1-re állított int, NEM EF-concurrency-token (az F2 tartalma); EF owned-értékobjektum NULL-csapda a scope-mezőnél. **2026-07-29 ROOT-REVIEW: APPROVED** (root-mérés 117/117 zöld, 0 warning). Három szeletben szállítva: FSM + 60 cellás actor/állapot mátrix · repository + DI + WorkPackage-parancsok · work-scope horgony + migráció + conformance-pin + Agreement-parancsok. Két szándékos, root által elfogadott döntés: (1) a parancs eredménye az ÚJ ÁLLAPOT, nem read-model — az AgreementReadModel két mezője ezen az aggregátumon kívülről jön, és félig kitöltött projekciónál a hívó nem tudná, melyik rész valódi (a teljes nézet az F3-é a projekcióval együtt); (2) a validátor sehol nem szigorúbb a domainnél (Cancel indok nélkül érvényes marad). UTÓLAG (F2-ben, valódi Postgresen) HÁROM F1-DEFEKTUS derült ki, mind javítva: AcceptanceEvidence oszlop sosem készült el migrációban (42703 minden agreement-íráson); az agreement állapot-történetének se EF-konfigurációja, se táblája nem volt (az FS