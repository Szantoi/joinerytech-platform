name: secret-scan

# Szivárgás-kapu (2026-07-29 eszkaláció: élő MCP-tokenek a publikus repóban).
#
# ⚠ A kapu a PUBLIKÁLT állapotot méri, nem a munkafát. A doc-capture mérése:
# a helyi fa 39 committel előrébb járt és részben már javítva volt —
# ugyanarra a tokenre `origin/main` 6 fájl, munkafa 4. Egy munkafa fölött futó
# kapu zöldet adott volna, miközben a token kint van.
#
# Ezért: PR-en a HEAD-et nézzük (ami publikálódni FOG), push után a főágat
# (ami publikálódott). A `fetch-depth: 0` kell, hogy a ref-ek olvashatók
# legyenek.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 1. A kapu ÖNELLENŐRZÉSE fut előbb: pozitív + negatív korpusz.
      #    Egy kapu, ami nem tud pirosra váltani, ugyanaz a hamis zöld, amit
      #    ez a szelet zárni akar. A negatív korpusz ugyanilyen fontos: ha a
      #    kapu a `${{ secrets.X }}`-re bukna, egy héten belül kikapcsolnák.
      - name: A kapu önellenőrzése
        run: node scripts/secret-scan.selftest.mjs

      # 2. A vizsgálandó ref: PR-en a forrás-HEAD, egyébként a main.
      - name: Szivárgás-vizsgálat a publikálandó/publikált ref-en
        run: node scripts/secret-scan.mjs "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
